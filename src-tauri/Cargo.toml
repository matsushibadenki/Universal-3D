[package]
name = "universal-3d"
version = "0.1.0"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["unstable", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "27"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
rfd = "0.16"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSView", "NSWindow", "NSColor", "NSGraphics", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer", "CATransaction"] }
